<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI - Call Kabeer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0D1117;
      color: #F0F6FC;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 24px;
      padding: 36px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.6);
      text-align: center;
    }
    .brand-icon {
      width: 56px; height: 56px;
      background: rgba(47, 128, 237, 0.2);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: #2F80ED; font-size: 28px;
      margin: 0 auto 16px auto;
    }
    h1 { font-family: 'Outfit', sans-serif; font-size: 24px; color: #F0F6FC; }
    .subtitle { font-size: 13px; color: #8B949E; margin-top: 4px; }
    .warning-banner {
      display: none;
      background: rgba(218, 54, 51, 0.15);
      border: 1px solid #DA3633;
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
      font-size: 12px;
      color: #F85149;
      text-align: left;
      line-height: 1.4;
    }
    .btn-call {
      width: 100%; margin-top: 24px;
      background: #2F80ED; color: #FFF; border: none;
      border-radius: 14px; padding: 16px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-call:hover { background: #256BC5; }
    .btn-call:active { transform: scale(0.98); }
    .btn-end {
      width: 100%; margin-top: 12px;
      background: #DA3633; color: #FFF; border: none;
      border-radius: 14px; padding: 14px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background 0.2s;
      display: none;
    }
    .btn-end:hover { background: #B62324; }
    .calling-ui { display: none; margin-top: 24px; }
    .avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: #21262D; border: 2px solid #2F80ED;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 16px auto;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(47,128,237,0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(47,128,237,0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(47,128,237,0); }
    }
    .call-status { font-size: 16px; font-weight: 700; color: #27AE60; margin-bottom: 6px; }
    .call-subtitle { font-size: 13px; color: #8B949E; margin-bottom: 16px; }
    .transcript {
      text-align: left; max-height: 220px; overflow-y: auto;
      background: #0D1117; border: 1px solid #30363D;
      border-radius: 12px; padding: 12px;
      font-size: 12px; line-height: 1.6;
      color: #8B949E;
    }
    .transcript .you { color: #58A6FF; }
    .transcript .agent { color: #3FB950; }
    .transcript .error { color: #F85149; font-weight: 600; }
    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 6px;
    }
    .status-dot.connected { background: #3FB950; }
    .status-dot.connecting { background: #D29922; animation: blink 1s infinite; }
    .status-dot.disconnected { background: #DA3633; }
    @keyframes blink { 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-icon">🎙️</div>
    <h1>Voice AI</h1>
    <p class="subtitle">Kabeer's AI Executive Secretary</p>

    <!-- B6: Secure Origin Warning -->
    <div class="warning-banner" id="insecureWarning">
      ⚠️ <strong>Insecure Origin Detected:</strong> Microphone capture is prohibited by browsers over unencrypted HTTP.
      Please open this page over <strong>HTTPS</strong> or via <strong>localhost</strong>.
    </div>

    <!-- Initial: Call button -->
    <div id="callSection">
      <button class="btn-call" id="btnCall" onclick="startCall()">📞 Call Kabeer</button>
    </div>

    <!-- Active call UI -->
    <div class="calling-ui" id="callingUI">
      <div class="avatar" id="avatar">🤖</div>
      <div class="call-status" id="callStatus">
        <span class="status-dot connecting" id="statusDot"></span>
        Connecting...
      </div>
      <div class="call-subtitle" id="callSubtitle">Setting up secure voice channel...</div>
      <div class="transcript" id="transcript"></div>
    </div>

    <button class="btn-end" id="btnEnd" onclick="endCall()">📵 End Call</button>
  </div>

  <script>
    // --- State ---
    let aaiWs = null;
    let relayWs = null;
    let audioCtx = null;
    let stream = null;
    let workletNode = null;
    let ready = false;
    let playbackTime = 0;
    let currentCallId = null;
    let sessionTimer = null;

    // Persona from /api/voice-token (single source of truth on the gateway).
    // Sent to AssemblyAI as the first session.update of the session.
    let persona = null;

    // Directives are spoken with reply.create, which leaves the system prompt
    // untouched. pendingDirective tracks the reply it produced so "spoken" is
    // only reported for that reply.
    let lastAppliedDirectiveVersion = 0;
    let pendingDirective = null;

    // Agent audio scheduled for playback, stopped when the caller barges in
    let scheduledSources = [];

    // Patch In: after the secretary's hand-off line, the mic is streamed to the
    // gateway (and on to Kabeer's phone) instead of AssemblyAI
    let bridgePending = false;
    let bridgeActive = false;

    // B6: Check Origin on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const isHttps = window.location.protocol === 'https:';
      if (!isLocal && !isHttps) {
        document.getElementById('insecureWarning').style.display = 'block';
        const callBtn = document.getElementById('btnCall');
        callBtn.disabled = true;
        callBtn.style.opacity = '0.5';
        callBtn.style.cursor = 'not-allowed';
      }
    });

    function addLog(text, cls) {
      const el = document.getElementById('transcript');
      const line = document.createElement('div');
      line.className = cls || '';
      line.textContent = text;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    function updateStatus(text, state) {
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot ' + state;
      const statusEl = document.getElementById('callStatus');
      statusEl.innerHTML = '';
      statusEl.appendChild(dot);
      statusEl.appendChild(document.createTextNode(' ' + text));
    }

    // B4: Directive Sanitization
    function sanitizeDirective(rawText) {
      if (!rawText) return '';
      // Strip control chars and newlines
      let clean = rawText.replace(/[\x00-\x1F\x7F\r\n]+/g, ' ').trim();
      // The directive is embedded in double quotes in the agent instructions
      clean = clean.replace(/"/g, "'");
      // Cap length at 300 chars
      if (clean.length > 300) clean = clean.substring(0, 300);
      return clean;
    }

    // B5: Correct Audio Gesture Ordering
    async function startCall() {
      // Hide call button, show calling UI
      document.getElementById('callSection').style.display = 'none';
      document.getElementById('callingUI').style.display = 'block';
      document.getElementById('btnEnd').style.display = 'block';

      try {
        // Step 1: Construct AudioContext synchronously (first statement, NO await before it)
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioCtxClass();

        // Step 2: Call resume() synchronously
        const resumePromise = audioCtx.resume();

        // Step 3: Await getUserMedia with differentiated errors
        updateStatus('Requesting mic access...', 'connecting');
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          });
        } catch (micErr) {
          if (micErr.name === 'NotAllowedError') {
            throw new Error('Microphone permission was denied by user or browser policy.');
          } else if (micErr.name === 'NotFoundError' || micErr.name === 'DevicesNotFoundError') {
            throw new Error('No microphone device was detected on your system.');
          } else if (micErr.name === 'SecurityError') {
            throw new Error('Insecure origin: Microphone capture is blocked on unencrypted HTTP.');
          } else {
            throw new Error('Microphone access failed: ' + micErr.message);
          }
        }

        // Step 4: Await AudioContext resume & load AudioWorklet module
        await resumePromise;
        await audioCtx.audioWorklet.addModule('/pcm-processor.js');

        // Step 5: Network calls are now safe (user gesture context already claimed)
        updateStatus('Fetching token & persona...', 'connecting');
        const tokenRes = await fetch('/api/voice-token');
        if (!tokenRes.ok) {
          let detail = await tokenRes.text();
          try { detail = JSON.parse(detail).error || detail; } catch (_) {}
          throw new Error(`Gateway ${tokenRes.status}: ${detail}`);
        }

        const { token, systemPrompt, greeting, voice } = await tokenRes.json();
        // Without a persona the agent would run as a generic assistant: refuse instead
        if (!token || !systemPrompt) {
          throw new Error('Gateway returned an incomplete voice session (missing token or persona).');
        }
        persona = { systemPrompt, greeting, voice };

        // Register call with Gateway
        updateStatus('Registering call session...', 'connecting');
        const callRes = await fetch('/api/call', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ callerName: 'Web Caller', topic: 'Direct Voice Call' }),
        });
        if (!callRes.ok) throw new Error('Call registration rejected by gateway: ' + await callRes.text());
        const callData = await callRes.json();
        currentCallId = callData.callId;

        // Connect Gateway Relay WebSocket (C1: call routing)
        const relayProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        relayWs = new WebSocket(`${relayProtocol}//${window.location.host}`);
        relayWs.binaryType = 'arraybuffer'; // Kabeer's voice arrives as raw PCM16 frames
        relayWs.onopen = () => {
          console.log('[Relay] Connected to gateway. Registering caller for', currentCallId);
          relayWs.send(JSON.stringify({
            type: 'REGISTER_CALLER',
            callId: currentCallId,
          }));
        };

        // Handle incoming Master Directives from mobile app
        relayWs.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            if (bridgeActive) schedulePcm16(new Uint8Array(event.data));
            return;
          }
          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'BRIDGE_ENDED') {
              addLog('Kabeer is no longer on the line.', 'error');
              cleanup('Call Ended');
              return;
            }
            if (msg.type === 'DIRECTIVE_UPDATED') {
              const { action, spokenDirective, directiveVersion } = msg.data || msg;

              // B3: Monotonically increasing directive version check
              const ver = Number(directiveVersion) || 1;
              if (ver <= lastAppliedDirectiveVersion) {
                console.log(`[Directive] Ignoring stale version ${ver} (current: ${lastAppliedDirectiveVersion})`);
                return;
              }
              lastAppliedDirectiveVersion = ver;

              if (action === 'hangup') {
                addLog('Kabeer ended the call.', '');
                cleanup('Call Ended');
                return;
              }
              if (action === 'patchedToMaster') bridgePending = true;

              const instructions = buildDirectiveInstructions(action, spokenDirective);
              if (!instructions) return;
              console.log(`[Directive] v${ver} ${action}: ${instructions}`);
              sendDirective(instructions, ver);
            }
          } catch (e) {
            console.error('[Relay] Directive error:', e);
          }
        };

        // Setup AudioWorklet for 24 kHz PCM16 downsampling
        const source = audioCtx.createMediaStreamSource(stream);
        workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor', {
          processorOptions: {
            inputSampleRate: audioCtx.sampleRate,
            targetSampleRate: 24000,
            chunkSamples: 1200, // 50 ms per input.audio message
          },
        });

        // Connect to AssemblyAI Voice Agent
        updateStatus('Connecting to AI Secretary...', 'connecting');
        const wsUrl = new URL('wss://agents.assemblyai.com/v1/ws');
        wsUrl.searchParams.set('token', token);
        aaiWs = new WebSocket(wsUrl);

        playbackTime = audioCtx.currentTime;

        workletNode.port.onmessage = (e) => {
          if (bridgeActive) {
            if (relayWs && relayWs.readyState === WebSocket.OPEN) relayWs.send(e.data);
            return;
          }
          if (ready && aaiWs && aaiWs.readyState === WebSocket.OPEN) {
            const b64 = btoa(String.fromCharCode(...new Uint8Array(e.data)));
            aaiWs.send(JSON.stringify({ type: 'input.audio', audio: b64 }));
          }
        };
        source.connect(workletNode).connect(audioCtx.destination);

        aaiWs.addEventListener('open', () => {
          updateStatus('Setting up secretary...', 'connecting');
          // Must be the first message: AssemblyAI configures the agent from it
          // and only then replies with session.ready. Greeting and voice cannot
          // be changed after this point.
          aaiWs.send(JSON.stringify({
            type: 'session.update',
            session: {
              system_prompt: persona.systemPrompt,
              greeting: persona.greeting,
              output: { voice: persona.voice },
            },
          }));
        });

        aaiWs.addEventListener('message', (event) => {
          // After Patch In the secretary's session is retired; ignore its last events
          if (event.target !== aaiWs) return;
          const msg = JSON.parse(event.data);

          if (msg.type === 'session.ready') {
            ready = true;
            console.log('[AssemblyAI] session.ready', msg.session_id, msg.config);
            updateStatus('AI Secretary Connected', 'connected');
            document.getElementById('callSubtitle').innerText = 'Speak naturally — the executive secretary is screening';

            // A directive that arrived before the session was ready
            if (pendingDirective && pendingDirective.attempts === 0) dispatchDirective();

            // B7: 10-minute session lifetime guard
            if (sessionTimer) clearTimeout(sessionTimer);
            sessionTimer = setTimeout(() => {
              addLog('⏱️ Session ended — 10 minute limit reached.', 'error');
              updateStatus('Session Ended (10m limit)', 'disconnected');
              if (relayWs && relayWs.readyState === WebSocket.OPEN) {
                relayWs.send(JSON.stringify({ type: 'SESSION_EXPIRED', callId: currentCallId }));
              }
              cleanup('Session Ended (10m limit)');
            }, 600000);
          }
          else if (msg.type === 'session.updated') {
            console.log('[AssemblyAI] session.updated', msg.config);
          }
          else if (msg.type === 'reply.started') {
            const d = pendingDirective;
            if (d && d.awaitingReply) {
              // First reply after reply.create is the directive being spoken
              d.awaitingReply = false;
              d.replyId = msg.reply_id;
              clearTimeout(d.timer);
              d.timer = setTimeout(() => {
                if (pendingDirective === d) retryOrFailDirective('no_agent_transcript');
              }, 30000);
            }
          }
          else if (msg.type === 'reply.audio') {
            const raw = atob(msg.data);
            const bytes = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            schedulePcm16(bytes);
          }
          else if (msg.type === 'reply.done' && msg.status === 'interrupted') {
            // Caller barged in: silence audio already queued for the old reply
            stopPlayback();
          }
          else if (msg.type === 'transcript.user') {
            addLog('You: ' + msg.text, 'you');
            if (relayWs && relayWs.readyState === WebSocket.OPEN) {
              relayWs.send(JSON.stringify({
                type: 'TRANSCRIPT_UPDATE',
                callId: currentCallId,
                speaker: 'Caller',
                text: msg.text,
              }));
            }
          }
          else if (msg.type === 'transcript.agent') {
            addLog('Secretary: ' + msg.text, 'agent');
            if (relayWs && relayWs.readyState === WebSocket.OPEN) {
              relayWs.send(JSON.stringify({
                type: 'TRANSCRIPT_UPDATE',
                callId: currentCallId,
                speaker: 'Secretary',
                text: msg.text,
              }));
            }

            const d = pendingDirective;
            if (d && d.replyId && msg.reply_id === d.replyId) {
              if (msg.interrupted) {
                retryOrFailDirective('interrupted_by_caller');
              } else {
                clearTimeout(d.timer);
                pendingDirective = null;
                reportDirective('DIRECTIVE_STATE', { state: 'spoken', version: d.version });
                if (bridgePending) startBridge();
              }
            }
          }
          else if (msg.type === 'session.error' || msg.type === 'error') {
            // D1: Surface AssemblyAI error frames verbatim in UI
            const errDetails = [msg.code, msg.message, msg.param && `(field: ${msg.param})`]
              .filter(Boolean).join(' — ') || JSON.stringify(msg);
            addLog('⚠️ AssemblyAI Error: ' + errDetails, 'error');
            if (!ready) updateStatus('Error', 'disconnected');
          }
          else if (msg.type === 'session.ended') {
            addLog('Session ended by server.', '');
            cleanup();
          }
        });

        aaiWs.addEventListener('close', (e) => {
          if (!aaiWs) return; // closed by cleanup()
          addLog(`AssemblyAI connection closed (code ${e.code}${e.reason ? ': ' + e.reason : ''}).`, ready ? '' : 'error');
          cleanup(ready ? 'Call Ended' : 'Failed to connect');
        });

        aaiWs.addEventListener('error', () => {
          // The close event that follows carries the code and reason
          addLog('AssemblyAI WebSocket connection error.', 'error');
        });

      } catch (err) {
        addLog('Error: ' + err.message, 'error');
        console.error(err);
        cleanup('Failed to connect');
      }
    }

    function stopPlayback() {
      for (const s of scheduledSources) {
        try { s.stop(); } catch (_) {}
      }
      scheduledSources = [];
      if (audioCtx) playbackTime = audioCtx.currentTime;
    }

    function buildDirectiveInstructions(action, spokenDirective) {
      const voiceRule = " Speak as Kabeer's secretary and refer to Kabeer in the third person.";
      if (action === 'holding') {
        return 'Kabeer has asked the caller to hold for about two minutes. Tell the caller this politely now.' + voiceRule;
      }
      if (action === 'patchedToMaster') {
        return 'Kabeer has decided to take this call. Tell the caller now that you are connecting them to Kabeer and ask them to stay on the line.' + voiceRule;
      }
      if (action === 'declined') {
        return 'Kabeer is not available right now. Tell the caller politely that he is unavailable, that you have noted their name and reason for calling, and that he will get back to them. Then say goodbye.' + voiceRule;
      }
      const clean = sanitizeDirective(spokenDirective);
      if (!clean) return '';
      return `Kabeer has sent you this message to pass on to the caller: "${clean}". Relay it to the caller now in your own words. If it is written from Kabeer's point of view (using "I" or "me"), convert it so you are talking about Kabeer.` + voiceRule;
    }

    function reportDirective(type, fields) {
      if (relayWs && relayWs.readyState === WebSocket.OPEN) {
        relayWs.send(JSON.stringify({ type, callId: currentCallId, ...fields }));
      }
    }

    // reply.create makes the agent speak now without touching the system
    // prompt, so the secretary persona stays intact across directives.
    function sendDirective(instructions, version) {
      if (!aaiWs) {
        reportDirective('DIRECTIVE_FAILED', { reason: 'call_not_connected', version });
        // No secretary to announce it, but Kabeer can still take the call
        if (bridgePending) startBridge();
        return;
      }
      if (pendingDirective) clearTimeout(pendingDirective.timer);
      pendingDirective = { version, instructions, attempts: 0, replyId: null, awaitingReply: false, timer: null };
      reportDirective('DIRECTIVE_STATE', { state: 'injected', version });
      // Before session.ready the directive waits; the session.ready handler sends it
      if (ready) dispatchDirective();
    }

    function dispatchDirective() {
      const d = pendingDirective;
      if (!d || !aaiWs || aaiWs.readyState !== WebSocket.OPEN) return;
      d.attempts++;
      d.replyId = null;
      d.awaitingReply = true;
      aaiWs.send(JSON.stringify({ type: 'reply.create', instructions: d.instructions }));
      clearTimeout(d.timer);
      d.timer = setTimeout(() => {
        if (pendingDirective === d) retryOrFailDirective('timeout_no_agent_speech');
      }, 10000);
    }

    function retryOrFailDirective(reason) {
      const d = pendingDirective;
      if (!d) return;
      if (d.attempts < 2 && aaiWs && aaiWs.readyState === WebSocket.OPEN) {
        console.warn(`[Directive] ${reason}; retrying once`);
        dispatchDirective();
        return;
      }
      clearTimeout(d.timer);
      pendingDirective = null;
      console.error(`[Directive] Failed: ${reason}`);
      reportDirective('DIRECTIVE_FAILED', { reason, version: d.version });
      // Kabeer is waiting to talk: connect even if the hand-off line wasn't spoken
      if (bridgePending) startBridge();
    }

    // Plays little-endian PCM16 mono at 24 kHz (secretary replies and Kabeer's voice)
    function schedulePcm16(bytes) {
      if (!audioCtx || bytes.length < 2) return;
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.length - (bytes.length % 2));
      const float32 = new Float32Array(view.byteLength / 2);
      for (let i = 0; i < float32.length; i++) float32[i] = view.getInt16(i * 2, true) / 32768;
      const buffer = audioCtx.createBuffer(1, float32.length, 24000);
      buffer.getChannelData(0).set(float32);
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      // Small lead so network jitter on the live bridge doesn't cause gaps
      const now = audioCtx.currentTime;
      if (playbackTime < now) playbackTime = now + (bridgeActive ? 0.08 : 0);
      src.start(playbackTime);
      playbackTime += buffer.duration;
      scheduledSources.push(src);
      src.onended = () => {
        scheduledSources = scheduledSources.filter(s => s !== src);
      };
    }

    // Hands the caller from the secretary to Kabeer once the hand-off line has
    // finished playing: ends the AssemblyAI session and streams the mic to the gateway
    function startBridge() {
      if (!bridgePending || bridgeActive) return;
      bridgePending = false;
      const remaining = audioCtx ? Math.max(0, playbackTime - audioCtx.currentTime) : 0;
      setTimeout(() => {
        if (!relayWs) return; // call ended meanwhile
        const oldAaiWs = aaiWs;
        aaiWs = null; // the close handler must not treat this as the call ending
        ready = false;
        if (sessionTimer) clearTimeout(sessionTimer);
        if (oldAaiWs && oldAaiWs.readyState === WebSocket.OPEN) {
          oldAaiWs.send(JSON.stringify({ type: 'session.end' }));
          setTimeout(() => oldAaiWs.close(), 1000);
        }
        bridgeActive = true;
        relayWs.send(JSON.stringify({ type: 'BRIDGE_READY', callId: currentCallId }));
        updateStatus('Connected to Kabeer', 'connected');
        document.getElementById('callSubtitle').innerText = 'You are now speaking with Kabeer';
        addLog('📞 Connected to Kabeer.', 'agent');
      }, remaining * 1000 + 300);
    }

    function endCall() {
      if (ready && aaiWs && aaiWs.readyState === WebSocket.OPEN) {
        aaiWs.send(JSON.stringify({ type: 'session.end' }));
        // Don't leave the caller stuck if session.ended never arrives
        setTimeout(() => { if (aaiWs) cleanup(); }, 3000);
      } else {
        cleanup();
      }
    }

    function cleanup(reason) {
      ready = false;
      bridgePending = false;
      bridgeActive = false;
      if (pendingDirective) {
        clearTimeout(pendingDirective.timer);
        pendingDirective = null;
      }
      if (sessionTimer) clearTimeout(sessionTimer);
      stopPlayback();
      // Null the globals before closing so the close handlers see a finished call
      const oldAaiWs = aaiWs;
      const oldRelayWs = relayWs;
      aaiWs = null;
      relayWs = null;
      oldAaiWs?.close();
      oldRelayWs?.close();
      stream?.getTracks().forEach(t => t.stop());
      audioCtx?.close();
      audioCtx = null;
      stream = null;
      updateStatus(reason || 'Call Ended', 'disconnected');
      document.getElementById('callSubtitle').innerText = 'The call has ended.';
      document.getElementById('avatar').style.animation = 'none';
    }

    window.addEventListener('pagehide', () => {
      if (aaiWs && aaiWs.readyState === WebSocket.OPEN) {
        aaiWs.send(JSON.stringify({ type: 'session.end' }));
      }
    });
  </script>
</body>
</html>
